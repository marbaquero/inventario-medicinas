<div id="config-warning" class="config-warning hidden">
  <div class="config-box">
    <h2>Falta configurar Supabase</h2>
    <p class="muted small">Abra este archivo con un editor de texto y reemplace <code>PASTE_YOUR_SUPABASE_URL_HERE</code> y <code>PASTE_YOUR_SUPABASE_ANON_KEY_HERE</code> cerca del inicio del archivo con los valores de su proyecto de Supabase.</p>

<div id="app"></div>

<script type="module">
/* ============================================================ */
/* Error display — never leave a blank page                     */
/* ============================================================ */
function showFatalError(title, detail){
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="loading-shell">
      <div class="config-box" style="text-align:left">
        <h2 style="margin-top:0;color:var(--brick)">${title}</h2>
        <p class="muted small">${detail}</p>
        <p class="muted small">Tome una captura de esta pantalla y envíela para revisarlo.</p>
      </div>
    </div>`;
}
window.addEventListener("error", (e)=>{
  showFatalError("Error al cargar la aplicación", esc(e.message || String(e)));
});
window.addEventListener("unhandledrejection", (e)=>{
  showFatalError("Error al cargar la aplicación", esc(e.reason?.message || String(e.reason)));
});

/* ============================================================ */
/* Supabase client                                              */
/* ============================================================ */
let supa = null;
function initSupabase(){
  if (!window.SUPABASE_URL || window.SUPABASE_URL.includes("PASTE_") ||
      !window.SUPABASE_ANON_KEY || window.SUPABASE_ANON_KEY.includes("PASTE_")) {
    document.getElementById("config-warning").classList.remove("hidden");
    return false;
  }
  if (!window.supabase || !window.supabase.createClient) {
    showFatalError("No se pudo cargar la librería de Supabase", "La conexión a internet pudo haber bloqueado cdn.jsdelivr.net. Intente recargar la página o probar con otra red.");
    return false;
  }
  supa = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  return true;
}

async function kvGet(key, fallback){
  const { data, error } = await supa.from("kv_store").select("value").eq("key", key).maybeSingle();
  if (error || !data) return fallback;
  return data.value;
}
async function kvSet(key, value){
  const { error } = await supa.from("kv_store").upsert({ key, value, updated_at: new Date().toISOString() });
  if (error) console.error("kvSet error", key, error);
  return !error;
}

/* ============================================================ */
/* Seed data                                                    */
/* ============================================================ */
const SEED_MEDS = [
  { id:"m1", name:"Pregabalina", dose:"75mg", brand:"Prestat", stock:40, minThreshold:15, dailyDose:1, unit:"tab", pricePerPill:0.703 },
  { id:"m2", name:"Ácido Acetilsalicílico", dose:"100mg", brand:"Aspirina Niños", stock:37, minThreshold:15, dailyDose:1, unit:"tab", pricePerPill:0.144 },
  { id:"m3", name:"Quetiapina", dose:"25mg", brand:"", stock:30, minThreshold:15, dailyDose:1, unit:"tab", pricePerPill:null },
  { id:"m4", name:"Quetiapina", dose:"100mg", brand:"", stock:41, minThreshold:15, dailyDose:1, unit:"tab", pricePerPill:0.995 },
  { id:"m5", name:"Simvastatina", dose:"20mg", brand:"", stock:39, minThreshold:15, dailyDose:1, unit:"tab", pricePerPill:0.225 },
  { id:"m6", name:"Escitalopram", dose:"10mg", brand:"", stock:36, minThreshold:15, dailyDose:1, unit:"tab", pricePerPill:null },
  { id:"m7", name:"Espironolactona", dose:"25mg", brand:"Aldactone A", stock:43, minThreshold:15, dailyDose:1, unit:"tab", pricePerPill:0.2527 },
  { id:"m8", name:"Losartán", dose:"100mg", brand:"", stock:37, minThreshold:15, dailyDose:1, unit:"tab", pricePerPill:0.325 },
  { id:"m9", name:"Omeprazol", dose:"20mg", brand:"", stock:18, minThreshold:15, dailyDose:1, unit:"tab", pricePerPill:null },
  { id:"m10", name:"Memantina", dose:"10mg", brand:"", stock:42, minThreshold:15, dailyDose:1, unit:"tab", pricePerPill:null },
  { id:"m11", name:"Levotiroxina", dose:"100mcg", brand:"", stock:243, minThreshold:30, dailyDose:1, unit:"tab", pricePerPill:null },
];
const SEED_PURCHASES = [{
  id:"p1", date:"2026-08-14", pharmacy:"Farmacia — Sucursal Carapungo", receiptRef:"416-003-000144332",
  items:[
    { name:"Aspirina Niños 100mg", qty:30, subtotal:4.32 },
    { name:"Quetiapina 100mg", qty:30, subtotal:29.85 },
    { name:"Aldactone A 25mg (Espironolactona)", qty:30, subtotal:7.58 },
    { name:"Simvastatina 20mg", qty:30, subtotal:6.75 },
    { name:"Losartán 100mg", qty:30, subtotal:9.75 },
    { name:"Prestat 75mg (Pregabalina)", qty:30, subtotal:21.09 },
  ], total:79.34, saved:27.6
}];

const todayISO = () => new Date().toISOString().slice(0,10);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ============================================================ */
/* App state                                                    */
/* ============================================================ */
const state = {
  meds: [], purchases: [], dispensing: [], fills: [], adminPin: null, isAdmin: false,
  tab: "dashboard", pendingAction: null,
};

async function loadAll(){
  const [m,p,d,f,s] = await Promise.all([
    kvGet("medications", null), kvGet("purchases", null), kvGet("dispensing", null), kvGet("fills", null), kvGet("settings", null)
  ]);
  state.meds = m || SEED_MEDS;
  state.purchases = p || SEED_PURCHASES;
  state.dispensing = d || [];
  state.fills = f || [];
  state.adminPin = s ? s.adminPin : null;
  if (!m) await kvSet("medications", state.meds);
  if (!p) await kvSet("purchases", state.purchases);
  if (!d) await kvSet("dispensing", state.dispensing);
  if (!f) await kvSet("fills", state.fills);

  // Migration: older purchase records saved item names only, with no medId link.
  // Match them to a medication by name/brand + dose so price history can connect.
  const norm = (s) => String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
  function findMedForItem(itemName){
    const in_ = norm(itemName);
    const candidates = state.meds.filter(med=>{
      const nName = norm(med.name), nBrand = norm(med.brand||"");
      return (nName && in_.includes(nName)) || (nBrand && in_.includes(nBrand));
    });
    if (candidates.length <= 1) return candidates[0] || null;
    const doseDigits = (med)=> (med.dose||"").replace(/[^0-9]/g,"");
    const withDoseMatch = candidates.filter(med=> doseDigits(med) && in_.includes(doseDigits(med)));
    return withDoseMatch[0] || candidates[0];
  }
  let purchasesChanged = false;
  const migratedPurchases = state.purchases.map(p=>{
    const items = p.items.map(it=>{
      if (it.medId) return it;
      const match = findMedForItem(it.name);
      if (!match) return it;
      purchasesChanged = true;
      return { ...it, medId: match.id };
    });
    return { ...p, items };
  });
  if (purchasesChanged) { state.purchases = migratedPurchases; await kvSet("purchases", state.purchases); }

  // Backfill: fill in missing pricePerPill from purchase history (fixes older saved data)
  let changed = false;
  const backfilled = state.meds.map(med=>{
    if (med.pricePerPill) return med;
    const matches = [];
    state.purchases.forEach(p=>{
      (p.items||[]).forEach(it=>{
        if (it.medId === med.id && it.qty) matches.push({ date: p.date, price: Number(it.subtotal)/Number(it.qty) });
      });
    });
    if (!matches.length) return med;
    matches.sort((a,b)=> a.date < b.date ? 1 : -1);
    changed = true;
    return { ...med, pricePerPill: matches[0].price };
  });
  if (changed) { state.meds = backfilled; await kvSet("medications", state.meds); }
}

function daysOfSupply(med){ const daily = med.dailyDose||1; if(daily<=0) return null; return Math.floor(med.stock/daily); }
function statusOf(med){
  const d = daysOfSupply(med);
  if (med.stock<=0) return "out";
  if (med.stock<=med.minThreshold) return "low";
  if (d!==null && d<=10) return "low";
  return "ok";
}
const STATUS_LABEL = { ok:"En regla", low:"Bajo stock", out:"Agotado" };

function pricePer30(med){ return med.pricePerPill ? med.pricePerPill*30 : null; }
function monthlyCost(med){ return med.pricePerPill ? med.pricePerPill * (med.dailyDose||1) * 30.44 : 0; }
function stockValue(med){ return med.pricePerPill ? med.pricePerPill * med.stock : 0; }
function nextRefillDate(med){
  const d = daysOfSupply(med);
  if (d===null) return null;
  const dt = new Date();
  dt.setDate(dt.getDate() + d);
  return dt.toISOString().slice(0,10);
}
function fmtDateEs(iso){
  if (!iso) return "—";
  const [y,m,d] = iso.split("-");
  return `${d}/${m}/${y}`;
}

function stockRingSVG(med, size=46){
  const status = statusOf(med);
  const target = Math.max(med.minThreshold*3, 30);
  const pct = Math.max(0, Math.min(1, med.stock/target));
  const r = (size-6)/2, c = 2*Math.PI*r;
  const color = status==="ok" ? "var(--sage)" : status==="low" ? "var(--amber)" : "var(--brick)";
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--ring-track)" stroke-width="4"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="4"
      stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}" stroke-linecap="round"
      transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" font-size="12" font-family="var(--mono)" fill="var(--ink)" font-weight="600">${med.stock}</text>
  </svg>`;
}
function badgeHTML(status){ return `<span class="badge badge-${status}">${STATUS_LABEL[status]}</span>`; }

let lastSyncAt = Date.now();
function syncAgoLabel(){
  const s = Math.max(0, Math.floor((Date.now()-lastSyncAt)/1000));
  if (s < 60) return `última sync hace ${s}s`;
  return `última sync hace ${Math.floor(s/60)}m`;
}
setInterval(()=>{
  const el = document.getElementById("sync-time");
  if (el) el.textContent = syncAgoLabel();
}, 1000);

let toastTimer;
function showToast(msg){
  let t = document.getElementById("toast");
  if(!t){ t = document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); }
  t.textContent = msg; t.classList.remove("hidden");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.add("hidden"), 2200);
}
let flashTimer;
function flashSync(){
  lastSyncAt = Date.now();
  const timeEl = document.getElementById("sync-time");
  if (timeEl) timeEl.textContent = syncAgoLabel();
  const el = document.getElementById("sync-pill");
  if(!el) return;
  el.classList.remove("hidden");
  clearTimeout(flashTimer); flashTimer = setTimeout(()=>el.classList.add("hidden"), 900);
}

async function persistMeds(next){ state.meds = next; await kvSet("medications", next); flashSync(); }
async function persistPurchases(next){ state.purchases = next; await kvSet("purchases", next); flashSync(); }
async function persistDispensing(next){ state.dispensing = next; await kvSet("dispensing", next); flashSync(); }
async function persistFills(next){ state.fills = next; await kvSet("fills", next); flashSync(); }

/* ---- admin gate ---- */
function requireAdmin(action){
  if (state.isAdmin){ action(); return; }
  state.pendingAction = action;
  openPinModal(state.adminPin ? "enter" : "set");
}

function openPinModal(mode){
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML = `
    <div class="modal pin-modal">
      <div class="label-eyebrow">Acceso administrador</div>
      <h3>${mode==="set" ? "Crear PIN de administrador" : "Ingrese su PIN"}</h3>
      <p class="muted small">${mode==="set" ? "Este PIN protege los cambios de inventario. Guárdelo en un lugar seguro." : "Se requiere PIN para editar inventario, compras o pastillero."}</p>
      <input autofocus type="password" inputmode="numeric" class="pin-input" placeholder="••••" maxlength="12" />
      <div class="error-text hidden" id="pin-error"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="pin-cancel">Cancelar</button>
        <button class="btn btn-primary" id="pin-submit" disabled>${mode==="set" ? "Guardar PIN" : "Entrar"}</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  const input = backdrop.querySelector(".pin-input");
  const submitBtn = backdrop.querySelector("#pin-submit");
  const errEl = backdrop.querySelector("#pin-error");
  input.addEventListener("input", ()=> submitBtn.disabled = !input.value);
  input.addEventListener("keydown", (e)=>{ if(e.key==="Enter" && input.value) submit(); });
  backdrop.querySelector("#pin-cancel").addEventListener("click", ()=>{ state.pendingAction=null; backdrop.remove(); });
  backdrop.addEventListener("click", (e)=>{ if(e.target===backdrop){ state.pendingAction=null; backdrop.remove(); } });
  submitBtn.addEventListener("click", submit);
  async function submit(){
    const val = input.value;
    if (mode === "set"){
      await kvSet("settings", { adminPin: val });
      state.adminPin = val; state.isAdmin = true;
      backdrop.remove(); render();
      showToast("PIN creado. Modo administrador activo.");
      if (state.pendingAction){ state.pendingAction(); state.pendingAction=null; }
    } else {
      if (val === state.adminPin){
        state.isAdmin = true; backdrop.remove(); render();
        showToast("Modo administrador activo");
        if (state.pendingAction){ state.pendingAction(); state.pendingAction=null; }
      } else {
        errEl.textContent = "PIN incorrecto. Intente de nuevo.";
        errEl.classList.remove("hidden");
      }
    }
  }
}

      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="med-cancel">Cancelar</button>
        <button class="btn btn-primary" id="med-save">Guardar</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  backdrop.addEventListener("click", (e)=>{ if(e.target===backdrop) backdrop.remove(); });

  backdrop.querySelector("#med-save").addEventListener("click", async ()=>{

    const updated = {
      ...form,
      id: form.id || ("m"+Date.now()),
      name: backdrop.querySelector("#f-name").value.trim(),
      dose: backdrop.querySelector("#f-dose").value.trim(),
      brand: backdrop.querySelector("#f-brand").value.trim(),

}

  const rows = isEdit ? existing.items.map(it=>({ medId: it.medId||"", qty: it.qty, subtotal: it.subtotal })) : [{ medId:"", qty:30, subtotal:0 }];
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML = `
    <div class="modal modal-wide">
      <div class="label-eyebrow">${isEdit ? "Editar compra" : "Registrar compra"}</div>
      <p class="muted small" style="margin-top:4px">Actualiza el precio de referencia de cada medicamento automáticamente.</p>
      <div class="form-grid">
        <label>Fecha<input id="p-date" type="date" value="${isEdit?existing.date:todayISO()}"/></label>
        <label>Farmacia / sucursal<input id="p-pharmacy" value="${isEdit?esc(existing.pharmacy):''}" placeholder="Ej. Farmacia Cruz Azul — Carapungo"/></label>
        <label>Referencia de factura<input id="p-ref" value="${isEdit?esc(existing.receiptRef||''):''}" placeholder="Opcional"/></label>
      </div>
      <label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--ink);font-weight:600">
        <input type="checkbox" id="p-addstock" ${isEdit?"":"checked"}/> Sumar estas cantidades al stock actual
      </label>
      ${isEdit ? `<div class="muted small" style="margin-top:4px">Al editar, desmarcado por defecto para no sumar el stock dos veces.</div>` : ""}
      <div class="label-eyebrow" style="margin-top:16px">Ítems (el stock se sumará automáticamente)</div>
      <div class="stack" id="p-rows" style="margin-top:8px"></div>
      <button class="btn btn-outline sm" id="p-addrow" style="margin-top:8px">+ Agregar ítem</button>
      <div class="row-between" style="margin-top:16px">
        <span class="muted small">Total</span>
        <span class="mono strong" id="p-total">$0.00</span>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="p-cancel">Cancelar</button>
        <button class="btn btn-primary" id="p-save">${isEdit ? "Guardar cambios" : "Guardar compra"}</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  const rowsEl = backdrop.querySelector("#p-rows");
  const totalEl = backdrop.querySelector("#p-total");
  const saveBtn = backdrop.querySelector("#p-save");

  function medOptions(selected){
    return state.meds.map(m=>`<option value="${m.id}" ${m.id===selected?"selected":""}>${esc(m.name)} ${esc(m.dose)}</option>`).join("");
  }
  function renderRows(){
    rowsEl.innerHTML = rows.map((r,idx)=>`
      <div class="purchase-row" data-idx="${idx}">
        <select class="r-med"><option value="">Seleccionar medicamento…</option>${medOptions(r.medId)}</select>
        <input class="r-qty" type="number" min="0" value="${r.qty}" placeholder="Cant."/>
        <input class="r-subtotal" type="number" min="0" step="0.01" value="${r.subtotal}" placeholder="Subtotal $"/>
        <button class="btn btn-ghost sm r-remove">✕</button>
      </div>`).join("");
    rowsEl.querySelectorAll(".purchase-row").forEach(rowEl=>{
      const idx = Number(rowEl.dataset.idx);
      rowEl.querySelector(".r-med").addEventListener("change", e=>{ rows[idx].medId = e.target.value; updateTotal(); });
      rowEl.querySelector(".r-qty").addEventListener("input", e=>{ rows[idx].qty = e.target.value; });
      rowEl.querySelector(".r-subtotal").addEventListener("input", e=>{ rows[idx].subtotal = e.target.value; updateTotal(); });
      rowEl.querySelector(".r-remove").addEventListener("click", ()=>{ rows.splice(idx,1); renderRows(); updateTotal(); });
    });
  }
  function updateTotal(){
    const total = rows.reduce((s,r)=>s+Number(r.subtotal||0),0);
    totalEl.textContent = "$"+total.toFixed(2);
  }
  renderRows(); updateTotal();
  backdrop.querySelector("#p-addrow").addEventListener("click", ()=>{ rows.push({medId:"",qty:30,subtotal:0}); renderRows(); updateTotal(); });
  backdrop.querySelector("#p-pharmacy").addEventListener("input", updateTotal);
  backdrop.addEventListener("click", (e)=>{ if(e.target===backdrop) backdrop.remove(); });
  backdrop.querySelector("#p-cancel").addEventListener("click", ()=>backdrop.remove());
  backdrop.querySelector("#p-save").addEventListener("click", async ()=>{
    const named = rows.filter(r=>r.medId).map(r=>{
      const med = state.meds.find(m=>m.id===r.medId);
      return { medId:r.medId, name: med?`${med.name} ${med.dose}`:"", qty:Number(r.qty), subtotal:Number(r.subtotal) };
    });
    if (!named.length || !backdrop.querySelector("#p-pharmacy").value.trim()) return;
    const total = named.reduce((s,it)=>s+it.subtotal,0);
    const purchase = {
      id: isEdit ? existing.id : "p"+Date.now(),
      date: backdrop.querySelector("#p-date").value,
      pharmacy: backdrop.querySelector("#p-pharmacy").value.trim(),
      receiptRef: backdrop.querySelector("#p-ref").value.trim(),
      items: named, total
    };
    const nextPurchases = isEdit
      ? state.purchases.map(p=>p.id===purchase.id?purchase:p)
      : [...state.purchases, purchase];
    await persistPurchases(nextPurchases);
    await applyPurchasePrices(purchase);
    const addStock = backdrop.querySelector("#p-addstock").checked;
    if (addStock){
      const nextMeds = state.meds.map(m=>{
        const match = named.find(it=>it.medId===m.id);
        return match ? { ...m, stock: m.stock + match.qty } : m;
      });
      await persistMeds(nextMeds);
    }
    backdrop.remove();
    showToast(isEdit ? "Compra actualizada" : (addStock ? "Compra registrada — stock y precios actualizados" : "Compra registrada — precios actualizados"));
    render();
  });
}

/* ---- actions ---- */
async function updateMedStock(id, delta){
  const next = state.meds.map(m=> m.id===id ? {...m, stock: Math.max(0, m.stock+delta)} : m);
  await persistMeds(next);
  render();
}
async function dispensePill(medId, qty, by){
  const med = state.meds.find(m=>m.id===medId);
  if (!med) return;
  const entry = { id:"d"+Date.now(), date: todayISO(), medId, medName:`${med.name} ${med.dose}`, qty, by: by||"" };
  await persistDispensing([...state.dispensing, entry]);
  const nextMeds = state.meds.map(m=> m.id===medId ? {...m, stock: Math.max(0, m.stock-qty)} : m);
  await persistMeds(nextMeds);
  showToast("Dosis registrada y descontada del stock");
}

async function registerFill(date, by, items, deductStock){
  const entry = { id:"f"+Date.now(), date, by, items };
  await persistFills([...state.fills, entry]);
  if (deductStock){
    const nextMeds = state.meds.map(m=>{
      const match = items.find(it=>it.medId===m.id);
      return match ? { ...m, stock: Math.max(0, m.stock - match.qty) } : m;
    });
    await persistMeds(nextMeds);
  }
}

async function updateFill(id, date, by, items, deductStock){
  const nextFills = state.fills.map(f=> f.id===id ? { ...f, date, by, items } : f);
  await persistFills(nextFills);
  if (deductStock){
    const nextMeds = state.meds.map(m=>{
      const match = items.find(it=>it.medId===m.id);
      return match ? { ...m, stock: Math.max(0, m.stock - match.qty) } : m;
    });
    await persistMeds(nextMeds);
  }
}

async function deleteFill(id){
  await persistFills(state.fills.filter(f=>f.id!==id));
  showToast("Llenado eliminado del historial");
  render();
}

async function applyPurchasePrices(purchase){
  // Purchases are historical/price records only — they do not change stock.
  const next = state.meds.map(m=>{
    const match = purchase.items.find(it=>it.medId===m.id);
    if (!match || !match.qty) return m;
    const pricePerPill = Number(match.subtotal) / Number(match.qty);
    return isFinite(pricePerPill) ? { ...m, pricePerPill } : m;
  });
  await persistMeds(next);
}

async function deletePurchase(id){
  await persistPurchases(state.purchases.filter(p=>p.id!==id));
  showToast("Compra eliminada del historial");
  render();
}

  const recentFills = [...state.fills].sort((a,b)=> a.date<b.date?1:-1).slice(0,4);
  const totalMonthlyCost = state.meds.reduce((s,m)=>s+monthlyCost(m),0);
  const totalValue = state.meds.reduce((s,m)=>s+stockValue(m),0);
  const missingPrice = state.meds.filter(m=>!m.pricePerPill);
  const soonest = state.meds
    .map(m=>({ med:m, refill: nextRefillDate(m) }))
    .filter(x=>x.refill)
    .sort((a,b)=> a.refill < b.refill ? -1 : 1)

          <div class="muted small" style="margin-top:2px">${dueSoon.length} medicamento(s) llegarán a su mínimo en este período</div>
        </div>
        <div class="panel">
          <div class="label-eyebrow">Sincronización</div>
          <div class="stat-num" style="font-size:24px;margin-top:6px">${state.purchases.length}</div>
          <div class="muted small" style="margin-top:2px">compras registradas · ${state.fills.length} llenados del pastillero</div>
        </div>
      </div>

        <div class="panel-head"><h3>Próximos a agotarse</h3><span class="muted small">según stock actual y dosis diaria</span></div>
        <div class="alert-list">
          ${soonest.map(({med,refill})=>`
            <div class="alert-row">
              ${stockRingSVG(med,40)}
              <div class="alert-info">
                <div class="alert-name">${esc(med.name)} ${esc(med.dose)}</div>
                <div class="muted small">${med.stock} ${med.unit} restantes · ${med.dailyDose||1}/día · agotamiento estimado ${fmtDateEs(refill)}</div>
              </div>
              ${badgeHTML(statusOf(med))}
            </div>`).join("") || `<div class="muted small">Sin datos suficientes para estimar.</div>`}
        </div>
      </section>
      ${lowStock.length ? `
      <section class="panel">
        <div class="panel-head"><h3>Atención requerida</h3><span class="muted small">${lowStock.length} medicamento(s) por debajo del umbral</span></div>
        <div class="alert-list">
          ${lowStock.map(m=>`
            <div class="alert-row">
              ${stockRingSVG(m,40)}
              <div class="alert-info"><div class="alert-name">${esc(m.name)} ${esc(m.dose)}</div><div class="muted small">${m.stock} ${m.unit} restantes · mínimo ${m.minThreshold}</div></div>
              ${badgeHTML(statusOf(m))}
            </div>`).join("")}
        </div>
      </section>` : ""}
      <div class="two-col">
        <section class="panel">
          <div class="panel-head"><h3>Última compra</h3></div>
          ${lastPurchase ? `
            <div class="row-between"><div class="muted small">${lastPurchase.date}</div><div class="mono strong">$${Number(lastPurchase.total).toFixed(2)}</div></div>
            <div class="muted small" style="margin-top:4px">${esc(lastPurchase.pharmacy)}</div>
            <ul class="mini-list" style="margin-top:10px">${lastPurchase.items.slice(0,4).map(it=>`<li><span>${esc(it.name)}</span><span class="mono">×${it.qty}</span></li>`).join("")}</ul>
          ` : `<div class="muted small">Sin compras registradas.</div>`}
        </section>
        <section class="panel">
          <div class="panel-head"><h3>Pastillero — últimos llenados</h3></div>
          ${recentFills.length ? `<ul class="mini-list">${recentFills.map(f=>`<li><span>${fmtDateEs(f.date)}${f.by?` · ${esc(f.by)}`:""}</span><span class="mono">${f.items.length} meds</span></li>`).join("")}</ul>` : `<div class="muted small">Sin llenados registrados aún.</div>`}
        </section>
      </div>
    </div>`;
}

function inventarioHTML(query=""){
  const filtered = state.meds.filter(m=>(m.name+m.dose+m.brand).toLowerCase().includes(query.toLowerCase()));
  const sorted = [...filtered].sort((a,b)=>a.name.localeCompare(b.name));
  return `
    <div class="stack-lg">
      <div class="row-between">
        <input class="search-input" id="inv-search" placeholder="Buscar medicamento…" value="${esc(query)}"/>
        <button class="btn btn-primary" id="inv-add">+ Nuevo</button>
      </div>
      <div class="med-grid">
        ${sorted.map(m=>{
          const status = statusOf(m); const dos = daysOfSupply(m);
          const p30 = pricePer30(m);
          const refill = nextRefillDate(m);
          return `
          <div class="med-card status-${status}">
            <div class="med-card-top">
              ${stockRingSVG(m)}
              <div class="med-card-title"><div class="med-name">${esc(m.name)}</div><div class="muted small">${esc(m.dose)}${m.brand?` · ${esc(m.brand)}`:""}</div></div>
              ${badgeHTML(status)}
            </div>
            ${p30 ? `<div class="mono small" style="color:var(--primary)">$${p30.toFixed(2)}/30u · $${m.pricePerPill.toFixed(4)}/pastilla</div>` : ""}
            <div class="med-card-meta"><span>Mínimo: <b class="mono">${m.minThreshold}</b></span><span>Dosis diaria: <b class="mono">${m.dailyDose||1}</b>/día</span>${dos!==null?`<span>≈ <b class="mono">${dos}</b> días</span>`:""}</div>
            ${refill ? `<div class="muted small">Agotamiento estimado: <span class="mono">${fmtDateEs(refill)}</span></div>` : ""}
            <div class="med-card-actions">
              <button class="btn btn-ghost sm inv-minus" data-id="${m.id}">−1</button>
              <button class="btn btn-ghost sm inv-plus" data-id="${m.id}">+1</button>
              <button class="btn btn-outline sm inv-edit" data-id="${m.id}">Editar</button>
            </div>
          </div>`;
        }).join("")}
      </div>
      ${!state.isAdmin ? `<div class="muted small hint">Ingrese como administrador para editar o ajustar stock.</div>` : ""}
    </div>`;
}

function comprasHTML(){
  const sorted = [...state.purchases].sort((a,b)=> a.date<b.date?1:-1);
  return `
    <div class="stack-lg">
      <div class="row-between">
        <div class="muted small">${state.purchases.length} compra(s) registrada(s)</div>
        <button class="btn btn-primary" id="pur-add">+ Registrar compra</button>
      </div>
      <div class="stack">
        ${sorted.map(p=>`
          <div class="panel">
            <div class="row-between">
              <div><div class="strong">${esc(p.pharmacy)}</div><div class="muted small">${p.date}${p.receiptRef?` · Ref. ${esc(p.receiptRef)}`:""}</div></div>
              <div class="text-right"><div class="mono strong">$${Number(p.total).toFixed(2)}</div>${p.saved?`<div class="muted small">Ahorro $${Number(p.saved).toFixed(2)}</div>`:""}</div>
            </div>
            <ul class="mini-list" style="margin-top:10px">${p.items.map(it=>`<li><span>${esc(it.name)} <span class="mono muted">×${it.qty}</span></span><span class="mono">$${Number(it.subtotal).toFixed(2)}</span></li>`).join("")}</ul>
            <div class="med-card-actions" style="margin-top:10px">
              <button class="btn btn-outline sm pur-edit" data-id="${p.id}">Editar</button>
              <button class="btn btn-danger sm pur-delete" data-id="${p.id}">Borrar</button>
            </div>
          </div>`).join("")}
        ${!state.purchases.length?`<div class="muted small">Sin compras registradas.</div>`:""}
      </div>
      ${!state.isAdmin ? `<div class="muted small hint">Ingrese como administrador para registrar compras.</div>` : ""}
    </div>`;
}

function pastilleroHTML(){
  const todayEntries = state.dispensing.filter(d=>d.date===todayISO());
  const map = {};
  [...state.dispensing].forEach(d=>{ map[d.date]=map[d.date]||[]; map[d.date].push(d); });
  const historyByDate = Object.entries(map).sort((a,b)=> a[0]<b[0]?1:-1).slice(0,7);

  const sortedFills = [...state.fills].sort((a,b)=> a.date<b.date?1:-1);
  const fillRows = sortedFills.map((f,idx)=>{
    const weekNum = sortedFills.length - idx;
    const prev = sortedFills[idx+1];
    let gap = "";
    if (prev){
      const days = Math.round((new Date(f.date) - new Date(prev.date)) / 86400000);
      gap = `${days} día${days===1?"":"s"}`;
    } else {
      gap = "primer registro";
    }
    return `
      <div class="fill-row">
        <span class="fill-check">✓</span>
        <div class="fill-info">
          <div class="strong">${fmtDateEs(f.date)}${f.by?` · ${esc(f.by)}`:""}</div>
          <div class="muted small">Semana ${weekNum}${idx===0?" · último registrado":""} · ${f.items.length} medicamentos</div>
        </div>
        <span class="badge badge-ok">${gap}</span>
        <button class="btn btn-outline sm fill-edit" data-id="${f.id}">Editar</button>
        <button class="btn btn-danger sm fill-delete" data-id="${f.id}">Borrar</button>
      </div>`;
  }).join("");

  return `
    <div class="stack-lg">
      <section class="panel">
        <div class="panel-head">
          <h3>Pastillero — llenado semanal</h3>
          <span class="muted small">Descuenta del stock (desmarcable al registrar)</span>
        </div>
        <button class="btn btn-primary" id="fill-add">+ Registrar llenado (las 11 de una vez)</button>
        <div class="stack" style="margin-top:14px">
          ${fillRows || `<div class="muted small">Sin llenados registrados aún.</div>`}
        </div>
        ${!state.isAdmin ? `<div class="muted small hint">Ingrese como administrador para registrar un llenado.</div>` : ""}
      </section>

      <section class="panel">
        <div class="panel-head"><h3>Registro rápido — una sola dosis</h3><span class="muted small">Descuenta del stock</span></div>
        <div class="dispense-form">
          <select id="disp-med">${state.meds.map(m=>`<option value="${m.id}">${esc(m.name)} ${esc(m.dose)}</option>`).join("")}</select>
          <input id="disp-qty" type="number" min="1" value="1" style="width:70px"/>
          <input id="disp-by" placeholder="Cuidadora (opcional)"/>
          <button class="btn btn-primary" id="disp-submit">Registrar</button>
        </div>
        <button class="btn btn-ghost sm" id="disp-quickadd" style="margin-top:8px">+ Agregar medicamento nuevo</button>
        ${!state.isAdmin ? `<div class="muted small hint">Ingrese como administrador para registrar dosis.</div>` : ""}
      </section>
      <section class="panel">
        <div class="panel-head"><h3>Hoy</h3><span class="muted small">${todayISO()}</span></div>
        ${todayEntries.length ? `<ul class="mini-list">${todayEntries.map(d=>`<li><span>${esc(d.medName)}${d.by?` · ${esc(d.by)}`:""}</span><span class="mono">×${d.qty}</span></li>`).join("")}</ul>` : `<div class="muted small">Sin dosis registradas hoy.</div>`}
      </section>
      <section class="panel">
        <div class="panel-head"><h3>Últimos 7 días con actividad</h3></div>
        <div class="stack">
          ${historyByDate.map(([date,entries])=>`
            <div class="history-day">
              <div class="mono strong small">${date}</div>
              <ul class="mini-list">${entries.map(d=>`<li><span>${esc(d.medName)}${d.by?` · ${esc(d.by)}`:""}</span><span class="mono">×${d.qty}</span></li>`).join("")}</ul>
            </div>`).join("")}
          ${!historyByDate.length?`<div class="muted small">Sin historial aún.</div>`:""}
        </div>
      </section>
    </div>`;
}

/* ---- batch fill modal (register all meds at once) ---- */
function openFillModal(existing){
  const isEdit = !!existing;
  const qtyFor = (m)=>{
    if (isEdit){
      const match = existing.items.find(it=>it.medId===m.id);
      if (match) return match.qty;
    }
    return (m.dailyDose||1)*7;
  };
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML = `
    <div class="modal modal-wide">
      <div class="label-eyebrow">${isEdit ? "Editar llenado del pastillero" : "Registrar llenado del pastillero"}</div>
      <p class="muted small" style="margin-top:4px">${isEdit ? "Corrija la fecha, cuidadora o cantidades de este registro." : `Registra el llenado de las ${state.meds.length} medicinas para la cuidadora.`}</p>
      <div class="form-grid">
        <label>Fecha<input id="fill-date" type="date" value="${isEdit?existing.date:todayISO()}"/></label>
        <label>Cuidadora<input id="fill-by" value="${isEdit?esc(existing.by||''):''}" placeholder="Ej. Aracely"/></label>
      </div>
      <label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--ink);font-weight:600">
        <input type="checkbox" id="fill-deduct" ${isEdit?"":"checked"}/> Descontar estas cantidades del stock actual
      </label>
      ${isEdit ? `<div class="muted small" style="margin-top:4px">Al editar, desmarcado por defecto para no descontar el stock dos veces — solo corrige el registro.</div>` : ""}
      <div class="label-eyebrow" style="margin-top:16px">Cantidad por medicamento (semanal)</div>
      <div class="stack" id="fill-rows" style="margin-top:8px">
        ${state.meds.map(m=>`
          <div class="purchase-row" style="grid-template-columns:1fr 90px" data-med="${m.id}">
            <span class="small">${esc(m.name)} ${esc(m.dose)}</span>
            <input type="number" min="0" class="fill-qty" value="${qtyFor(m)}"/>
          </div>`).join("")}
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="fill-cancel">Cancelar</button>
        <button class="btn btn-primary" id="fill-save">${isEdit ? "Guardar cambios" : "Guardar llenado"}</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  backdrop.addEventListener("click", (e)=>{ if(e.target===backdrop) backdrop.remove(); });
  backdrop.querySelector("#fill-cancel").addEventListener("click", ()=>backdrop.remove());
  backdrop.querySelector("#fill-save").addEventListener("click", async ()=>{
    const date = backdrop.querySelector("#fill-date").value;
    const by = backdrop.querySelector("#fill-by").value.trim();
    const deduct = backdrop.querySelector("#fill-deduct").checked;
    const items = [];
    backdrop.querySelectorAll("[data-med]").forEach(row=>{
      const medId = row.dataset.med;
      const qty = Number(row.querySelector(".fill-qty").value);
      const med = state.meds.find(m=>m.id===medId);
      if (qty > 0) items.push({ medId, medName: med?`${med.name} ${med.dose}`:"", qty });
    });
    if (!items.length) return;
    if (isEdit){
      await updateFill(existing.id, date, by, items, deduct);
    } else {
      await registerFill(date, by, items, deduct);
    }
    backdrop.remove();
    showToast(isEdit ? "Llenado actualizado" : (deduct ? `Llenado registrado — stock descontado en ${items.length} medicamentos` : `Llenado registrado — ${items.length} medicamentos`));
    render();
  });
}

function wireTabEvents(){
  if (state.tab==="inventario"){
    const search = document.getElementById("inv-search");
    search.addEventListener("input", ()=>{ document.getElementById("tab-content").innerHTML = inventarioHTML(search.value); wireTabEvents(); });
    document.getElementById("inv-add").addEventListener("click", ()=> requireAdmin(()=> openMedEditModal({id:"",name:"",dose:"",brand:"",stock:0,minThreshold:15,dailyDose:1,unit:"tab"})));
    document.querySelectorAll(".inv-minus").forEach(b=>b.addEventListener("click", ()=> requireAdmin(()=>updateMedStock(b.dataset.id,-1))));
    document.querySelectorAll(".inv-plus").forEach(b=>b.addEventListener("click", ()=> requireAdmin(()=>updateMedStock(b.dataset.id,1))));
    document.querySelectorAll(".inv-edit").forEach(b=>b.addEventListener("click", ()=> requireAdmin(()=>openMedEditModal(state.meds.find(m=>m.id===b.dataset.id)))));
  }
  if (state.tab==="compras"){
    document.getElementById("pur-add").addEventListener("click", ()=> requireAdmin(()=>openPurchaseModal()));
    document.querySelectorAll(".pur-edit").forEach(b=>b.addEventListener("click", ()=> requireAdmin(()=>openPurchaseModal(state.purchases.find(p=>p.id===b.dataset.id)))));
    document.querySelectorAll(".pur-delete").forEach(b=>b.addEventListener("click", ()=> requireAdmin(()=>{
      if (confirm("¿Eliminar esta compra del historial?")) deletePurchase(b.dataset.id);
    })));
  }
  if (state.tab==="pastillero"){
    document.getElementById("disp-submit").addEventListener("click", ()=>{
      const medId = document.getElementById("disp-med").value;
      const qty = Number(document.getElementById("disp-qty").value);
      const by = document.getElementById("disp-by").value;
      if (!medId || qty<1) return;
      requireAdmin(async ()=>{ await dispensePill(medId, qty, by); render(); });
    });
    document.getElementById("fill-add").addEventListener("click", ()=> requireAdmin(()=>openFillModal()));
    document.querySelectorAll(".fill-edit").forEach(b=>b.addEventListener("click", ()=> requireAdmin(()=>openFillModal(state.fills.find(f=>f.id===b.dataset.id)))));
    document.querySelectorAll(".fill-delete").forEach(b=>b.addEventListener("click", ()=> requireAdmin(()=>{
      if (confirm("¿Eliminar este llenado del historial?")) deleteFill(b.dataset.id);
    })));
    const quickAdd = document.getElementById("disp-quickadd");
    if (quickAdd) quickAdd.addEventListener("click", ()=> requireAdmin(()=> openMedEditModal({id:"",name:"",dose:"",brand:"",stock:0,minThreshold:15,dailyDose:1,unit:"tab",pricePerPill:null})));
  }
}

/* ============================================================ */
/* Boot                                                          */
/* ============================================================ */
async function boot(){
  try {
    const app = document.getElementById("app");
    if (!initSupabase()) return;
    app.innerHTML = `<div class="loading-shell"><div><div class="loader-ring"></div><div class="muted small" style="margin-top:12px;text-align:center">Cargando inventario…</div></div></div>`;
    await loadAll();
    render();
  } catch (err) {
    showFatalError("No se pudo cargar el inventario", esc(err.message || String(err)));
  }
}
boot();
</script>
